<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HR Dashboard | MES Assessment</title><link rel="stylesheet" href="css/styles.css"></head>
<body><header><b>HYUNDAI AUTOEVER MEXICO</b><span>HR Assessment Dashboard</span></header>
<main>
<section id="login" class="card"><small>HR ACCESS</small><h1>Assessment Results</h1>
<p>Sign in with an authorized HR account.</p>
<form id="loginForm"><label>Email<input id="hrEmail" type="email" required></label>
<label>Password<input id="hrPassword" type="password" required></label><button>Sign in</button></form>
<p id="loginMsg" class="error"></p></section>

<section id="dash" class="hidden"><div class="dashhead"><div><small>TECHNICAL ASSESSMENTS</small><h1>Candidate Results</h1></div>
<div><button class="light" onclick="load()">Refresh</button> <button class="light" onclick="signout()">Sign out</button></div></div>
<div id="table" class="card">Loading…</div><div id="detail" class="card hidden"></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script><script src="js/admin.js?v=2"></script>
</body></html>
